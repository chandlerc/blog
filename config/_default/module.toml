[[mounts]]
  source = 'static'
  target = 'static'

# Frozen pages, captured by tools/archive. Raw bytes for URLs Hugo no longer
# renders, published exactly as they are. See archive/README.md.
[[mounts]]
  source = 'archive/site'
  target = 'static'

[[mounts]]
  source = 'LICENSE.md'
  target = 'static/LICENSE.md'

[[mounts]]
  source = 'assets'
  target = 'assets'

# Outputs generated by tools/hl; see docs/code-highlighting.md.
[[mounts]]
  source = 'gen/assets'
  target = 'assets'

[[mounts]]
  source = 'gen/data'
  target = 'data'

[[mounts]]
  source = 'layouts'
  target = 'layouts'

[[mounts]]
  source = 'third_party/highlight.js/assets/css'
  target = 'assets/hljs/css'

[[mounts]]
  source = 'third_party/highlight.js/assets/js'
  target = 'assets/hljs/js'

[[mounts]]
  source = 'third_party/dracula/highlightjs'
  target = 'assets/dracula/css'
  files = '*.scss'

[[mounts]]
  source = 'third_party/carbon-lang/assets/js'
  target = 'assets/carbon-lang/js'

[[mounts]]
  source = 'third_party/iosevka/layouts/partials'
  target = 'layouts/partials/iosevka'

[[mounts]]
  source = 'third_party/iosevka/static/fonts'
  target = 'assets/fonts/iosevka'

[[mounts]]
  source = 'third_party/open_sans'
  target = 'assets/fonts/open_sans'
  files = '*.woff2'

[[mounts]]
  source = 'third_party/montserrat'
  target = 'assets/fonts/montserrat'
  files = '*.woff2'
